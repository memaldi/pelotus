version: '3.8'

services:
  web:
    build:
      context: ./nuxt-app
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://pelotus:pelotus@postgres:5432/pelotus
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./nuxt-app
      dockerfile: Dockerfile
    command: npx ts-node --project tsconfig.worker.json worker.ts
    environment:
      - DATABASE_URL=postgresql://pelotus:pelotus@postgres:5432/pelotus
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pelotus
      POSTGRES_PASSWORD: pelotus
      POSTGRES_DB: pelotus
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
